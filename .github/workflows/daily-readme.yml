# Draw a new tarot card each day and push the new README.md to master.
# The run is minimal to save Actions minutes: no lint, type checks, or tests.
# Start the workflow manually with run_checks to run the checks before the generator.
# Two jobs: "generate" runs the npm dependencies with a read-only token. "push" has the write token,
# but it runs no npm code. Thus a compromised dependency cannot get the write token.
# One-time setup: Settings → Actions → General → Workflow permissions → "Read and write permissions".
# If master has branch protection or a ruleset, let GitHub Actions bypass it.

name: Daily README

on:
  schedule:
    # 11:00 in Amsterdam. GitHub applies the time zone, including the daylight saving time change.
    - cron: '0 11 * * *'
      timezone: Europe/Amsterdam
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and show README.md only. Do not commit or push.
        type: boolean
        required: true
        default: false
      run_checks:
        description: Run the type checks and tests before the generator.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Only one run at a time. A new run waits. It does not cancel a run that pushes.
concurrency:
  group: daily-readme
  cancel-in-progress: false

jobs:
  generate:
    name: Generate README.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Scheduled runs have no inputs. Thus both values are false for them.
      DRY_RUN: ${{ inputs.dry_run == true }}
      RUN_CHECKS: ${{ inputs.run_checks == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Only on an explicit request. A failure stops the run before README.md changes.
      - name: Check types
        if: env.RUN_CHECKS == 'true'
        run: npm run typecheck
      - name: Test
        if: env.RUN_CHECKS == 'true'
        run: npm test
      - name: Generate README.md
        run: npm run readme
      - name: Show the result
        run: |
          git --no-pager diff --stat
          head -n 1 README.md
      - name: Keep README.md for the push job
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme
          path: README.md
          if-no-files-found: error
          retention-days: 1

  push:
    name: Push README.md
    needs: generate
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only this job can push. It runs no npm code. The token goes only to the push command.
    permissions:
      contents: write # Push the README.md commit to master.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: readme
          path: ${{ runner.temp }}/readme
      - name: Check and copy README.md
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/readme
        run: |
          # The artifact must contain only one regular file: README.md, smaller than 1 MiB, with the generator header.
          entries="$(find "$ARTIFACT_DIR" -mindepth 1 | wc -l)"
          file="$ARTIFACT_DIR/README.md"
          if [ "$entries" -ne 1 ] || [ ! -f "$file" ] || [ -L "$file" ]; then
            echo "::error::The artifact must contain only README.md."
            exit 1
          fi
          if [ "$(stat -c %s "$file")" -gt 1048576 ]; then
            echo "::error::README.md is larger than 1 MiB."
            exit 1
          fi
          if ! head -n 1 "$file" | grep -q '^<!-- Generated by `npm run readme`'; then
            echo "::error::README.md does not start with the generator header."
            exit 1
          fi
          cp -- "$file" README.md
      - name: Commit and push README.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if git diff --quiet -- README.md && git ls-files --error-unmatch README.md >/dev/null 2>&1; then
            echo "README.md did not change. Nothing to push."
            exit 0
          fi
          # Git hooks are off, so that no file from the repository runs with the token.
          git add -- README.md
          git -c core.hooksPath=/dev/null -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'docs: update the tarot card of the day in README.md'
          # Give the token to this one Git command only. It is not stored in the Git configuration.
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c core.hooksPath=/dev/null -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" push "${SERVER_URL}/${REPOSITORY}.git" HEAD:refs/heads/master
