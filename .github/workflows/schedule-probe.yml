# TEMPORARY: check that GitHub starts scheduled workflows in this repository.
# The workflow starts every 5 minutes. The first scheduled run disables the workflow, so that it stops.
# A manual start only shows the information. It does not disable the workflow.
# Delete this file after the check.

name: Schedule Probe

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Show the trigger and stop the schedule
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write # Disable this workflow after the first scheduled run.
    steps:
      - name: Show trigger information
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Schedule: $SCHEDULE"
          echo "UTC: $(date -u)"
          echo "Amsterdam: $(TZ=Europe/Amsterdam date)"
          echo "Scheduler is working!"
      - name: Disable this workflow
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow disable schedule-probe.yml --repo "$REPOSITORY"
