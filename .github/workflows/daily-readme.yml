# Draw a new tarot card each day and push the new README.md to master.
# The run is minimal to save Actions minutes: no lint, type checks, or tests.
# Start the workflow manually with run_checks to run the checks before the generator.
# One-time setup: Settings → Actions → General → Workflow permissions → "Read and write permissions".
# If master has branch protection or a ruleset, let GitHub Actions bypass it.

name: Daily README

on:
  schedule:
    # 11:00 in Amsterdam. GitHub applies the time zone, including the daylight saving time change.
    - cron: '0 11 * * *'
      timezone: Europe/Amsterdam
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and show README.md only. Do not commit or push.
        type: boolean
        required: true
        default: false
      run_checks:
        description: Run the type checks and tests before the generator.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Only one run at a time. A new run waits. It does not cancel a run that pushes.
concurrency:
  group: daily-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can push. The token goes only to the push step.
    permissions:
      contents: write
    env:
      # Scheduled runs have no inputs. Thus both values are false for them.
      DRY_RUN: ${{ inputs.dry_run == true }}
      RUN_CHECKS: ${{ inputs.run_checks == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Only on an explicit request. A failure stops the run before README.md changes.
      - name: Check types
        if: env.RUN_CHECKS == 'true'
        run: npm run typecheck
      - name: Test
        if: env.RUN_CHECKS == 'true'
        run: npm test
      - name: Generate README.md
        run: npm run readme
      - name: Show the result
        run: |
          git --no-pager diff --stat
          head -n 1 README.md
      - name: Commit and push README.md
        if: env.DRY_RUN != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if git diff --quiet -- README.md && git ls-files --error-unmatch README.md >/dev/null 2>&1; then
            echo "README.md did not change. Nothing to push."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'docs: update the tarot card of the day in README.md'
          # Give the token to this one Git command only. It is not stored in the Git configuration.
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" push "${SERVER_URL}/${REPOSITORY}.git" HEAD:refs/heads/master
